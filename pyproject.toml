[project]
name = "model-compare"
version = "0.1.0"
description = "Run one prompt against many LLMs via OpenRouter and generate a side-by-side comparison report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "python-frontmatter>=1.1",
  "pyyaml>=6.0",
  "textual>=6.0",
  "tomlkit>=0.13",
]

[project.scripts]
model-compare = "model_compare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_compare"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
